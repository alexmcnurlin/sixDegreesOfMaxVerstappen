type Driver {
  id: String!
  name: String!
  teammates: [Teammate!]
}

type Teammate {
  driver: Driver!
  dates: [GrandPrixRange!]
}

type Pairing {
  driver1: Driver!
  driver2: Driver!
  dates: [GrandPrixRange!]
}

type GrandPrixRange {
  startRace: String!
  startDate: String!
  startUrl: String!
  count: Int!
  endRace: String!
  endDate: String!
  endUrl: String!
}

type Query {
  drivers: [Driver!]!
  degreesOfSeparation(driver1: String, driver2: String): [Pairing!]!
}
