version: 1
applications:
  - frontend:
      phases:
          preBuild:
              commands:
                  - 'npm ci --cache .npm --prefer-offline --prefix ../'
          build:
              commands:
                  - 'npm run release:build-server --prefix ../'
          postBuild:
              commands:
                  - 'npm run amplify-postbuild --prefix ../'
      artifacts:
          baseDirectory: ../.amplify-hosting
          files:
              - '**/*'
      cache:
          paths:
              - '.npm/**/*'
    appRoot: server
  - frontend:
      phases:
          preBuild:
              commands:
                  - 'npm ci --cache .npm --prefer-offline --prefix ../'
          build:
              commands:
                  - 'npm run release:build-client --prefix ../'
      artifacts:
          baseDirectory: dist
          files:
              - '**/*'
      cache:
          paths:
              - '.npm/**/*'
    appRoot: client
