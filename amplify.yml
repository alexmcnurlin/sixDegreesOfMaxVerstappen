version: 1
applications:
  - appRoot: server
    backend:
      phases:
          preBuild:
              commands:
                  - 'npm ci --cache .npm --prefer-offline'
          build:
              commands:
                  - 'npm run release:build-server'
      artifacts:
          baseDirectory: server/lib
          files:
              - '**/*'
      cache:
          paths:
              - '.npm/**/*'

  - appRoot: client
    frontend:
        phases:
            preBuild:
                commands:
                    - 'npm ci --cache .npm --prefer-offline'
            build:
                commands:
                    - 'npm run release:build-server'
        artifacts:
            baseDirectory: server/lib
            files:
                - '**/*'
        cache:
            paths:
                - '.npm/**/*'
