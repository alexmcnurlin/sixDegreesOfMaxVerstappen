version: 1
frontend:
  phases:
      preBuild:
          commands:
              - 'npm ci --cache .npm --prefer-offline'
      build:
          commands:
              - 'npm run release:build-server'
      postBuild:
          commands:
              - 'npm run amplify-postbuild'
  artifacts:
      baseDirectory: .amplify-hostigitg
      files:
          - '**/*'
  cache:
      paths:
          - '.npm/**/*'
